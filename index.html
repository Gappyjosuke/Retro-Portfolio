<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VT340 Terminal Retro Portfolio">
    <title>VT340 Terminal | Retro Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/CSS/crt.css">
    <link rel="stylesheet" href="/CSS/terminal.css">

    <div id="audio-assets" style="display: none;">
        <audio id="navSound" src="Assets/Audio/sectionbutton.mp3" preload="auto"></audio>
        <audio id="themeSound" src="Assets/Audio/buttonclick.mp3" preload="auto"></audio>
        <audio id="playSound" src="Assets/Audio/bootsound.mp3" preload="auto"></audio> 
    </div>
</head>

<body class="retro-main crt-green">
    <main class="crt-housing">
        <div class="crt-bevel">
            <div class="crt-screen crt-curve crt-flicker">
                
                <div class="crt-effects-container">
                    <div class="crt-overlay"></div>
                    <div class="crt-reflection"></div>
                    <div class="crt-scanlines"></div>
                    <div class="crt-bloom"></div>
                    <div class="crt-burn"></div>
                    <div class="crt-glass"></div>
                </div>

                <section class="terminal-container">
                    <div class="terminal-window">
                        <header class="window-header">
                            <div class="window-controls">
                                <span class="control close" title="Exit Terminal" id="exitTerminal"></span>
                                <span class="control minimize" title="Minimize"></span>
                                <span class="control maximize" title="Full Screen"></span>
                            </div>
                            <div class="title phosphor-text" id="terminalTitle">VT340 Terminal</div>
                        </header>

                        <div class="window-body">
                            <div id="terminal" class="terminal-content"></div>
                            
                            <div class="input-container">
                                <span id="dynamicPrompt" class="custom-font prompt phosphor-text">guest@vt340:~$</span>
                                <input type="text" id="commandInput" autofocus spellcheck="false" class="phosphor-text crt-input">
                                <div class="cursor crt-cursor phosphor-text" id="cursor">█</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <nav class="nav-controls">
                <button class="dim nav-button prev" aria-label="Previous">◄</button>
                <button class="dim nav-button next" aria-label="Next">►</button>
            </nav>

            <footer class="monitor-branding">
                <div class="dim model-number">VT340</div>
                <div class="manufacturer">DIGITAL EQUIPMENT CORPORATION</div>
                <div class="features">ReGIS Graphics • Sixel • 256 Colors</div>
            </footer>

            <aside class="monitor-controls">
                <div class="music-toggle-container"></div>
                <div class="etstcontrol-knob brightness" title="Brightness"></div>
                <div class="contrast" title="Contrast"></div>
                <button class="power-button" title="Change Theme" aria-label="Power Switch"></button>
            </aside>
        </div>

        <div class="crt-base">
            <div class="tilt-adjustment"></div>
            <div class="vent-slots"></div>
        </div>
    </main>

    <script src="JS/terminal.js"></script>
</body>
</html>
